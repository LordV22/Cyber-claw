name: Build e Deploy Universal
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm run build
      - name: Verifica se build gerou pasta dist
        run: |
          if [ ! -d "ui/dist" ]; then echo "ERRO: Build não gerou arquivos"; exit 1; fi
